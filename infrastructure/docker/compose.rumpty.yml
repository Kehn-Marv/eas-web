services:
  migrate:
    build:
      context: ../..
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ../..
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: production
      STORAGE_BACKEND: s3
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + str(${PORT:-8000}) + '/v1/readiness')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
      args:
        PARSER_EXTRA: ${PARSER_EXTRA:-}
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: production
      STORAGE_BACKEND: s3
    depends_on:
      migrate:
        condition: service_completed_successfully
