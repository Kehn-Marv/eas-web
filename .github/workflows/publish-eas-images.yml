name: Publish EAS runtime images

on:
  push:
    branches: [main]
    paths:
      - "apps/eas/**"
      - ".github/workflows/publish-eas-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eas-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish EAS
        uses: docker/build-push-action@v6
        with:
          context: apps/eas
          file: apps/eas/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eas-web/eas:latest
            ghcr.io/${{ github.repository_owner }}/eas-web/eas:${{ github.sha }}
          cache-from: type=gha,scope=eas
          cache-to: type=gha,mode=max,scope=eas

      - name: Build and publish sandbox runner
        uses: docker/build-push-action@v6
        with:
          context: apps/eas
          file: apps/eas/Dockerfile.runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eas-web/sandbox-runner:latest
            ghcr.io/${{ github.repository_owner }}/eas-web/sandbox-runner:${{ github.sha }}
          cache-from: type=gha,scope=eas-runner
          cache-to: type=gha,mode=max,scope=eas-runner
