name: Publish EAS runtime images

on:
  push:
    branches: [main]
    paths:
      - "apps/eas/**"
      - ".github/workflows/publish-eas-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eas-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish EAS
        uses: docker/build-push-action@v6
        with:
          context: apps/eas
          file: apps/eas/Dockerfile
          # The Dockerfile's final stage is the development image. Pin the
          # published runtime explicitly to the production stage.
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/eas-web:latest
            ${{ env.IMAGE_NAMESPACE }}/eas-web:${{ github.sha }}
          cache-from: type=gha,scope=eas
          cache-to: type=gha,mode=max,scope=eas

      - name: Build and publish sandbox runner
        uses: docker/build-push-action@v6
        with:
          context: apps/eas
          file: apps/eas/Dockerfile.runner
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/eas-web-runner:latest
            ${{ env.IMAGE_NAMESPACE }}/eas-web-runner:${{ github.sha }}
          cache-from: type=gha,scope=eas-runner
          cache-to: type=gha,mode=max,scope=eas-runner
